name: Build OpenWrt – Lite-On WP8722-BT

on:
  # Trigger otomatis saat .config atau workflow ini berubah
  push:
    branches:
      - liteon_wp8722-bt
  #  paths:
  #    - '.config'
  #    - '.github/workflows/build-openwrt.yml'

  # Trigger manual dari tab Actions
  workflow_dispatch:
    inputs:
      upload_packages:
        description: 'Sertakan folder packages/ dalam artifact?'
        required: false
        default: 'false'
        type: boolean

env:
  # Nama file konfigurasi di root repo
  CONFIG_FILE: .config
  TZ: Asia/Jakarta

jobs:
  build:
    runs-on: ubuntu-22.04
    # Batas waktu 6 jam. Build ath79/generic biasanya selesai dalam 3-5 jam.
    timeout-minutes: 360

    steps:

    # ──────────────────────────────────────────────────────────────
    # 1. CHECKOUT REPO
    # Checkout fork kita sendiri pada branch liteon_wp8722-bt.
    # Tidak perlu menentukan 'repository' karena workflow ini dijalankan
    # dari repo kita sendiri (hasil fork dari madIlama/openwrt).
    # ──────────────────────────────────────────────────────────────
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        ref: liteon_wp8722-bt
        fetch-depth: 1

    # ──────────────────────────────────────────────────────────────
    # 2. BEBASKAN DISK SPACE
    # Runner GitHub punya ~14 GB disk. Build OpenWrt ath79 butuh ~8-12 GB.
    # Hapus tool yang tidak dibutuhkan untuk proses build.
    # ──────────────────────────────────────────────────────────────
    - name: Free disk space
      run: |
        echo "=== Disk sebelum cleanup ==="
        df -h
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force 2>/dev/null || true
        sudo apt-get autoremove -y --purge 2>/dev/null || true
        sudo apt-get clean 2>/dev/null || true
        echo "=== Disk setelah cleanup ==="
        df -h

    # ──────────────────────────────────────────────────────────────
    # 3. INSTALL BUILD DEPENDENCIES
    # Daftar ini sesuai dengan persyaratan OpenWrt 25.12 di Ubuntu 22.04.
    # Referensi: https://github.com/openwrt/openwrt (README openwrt-25.12 branch)
    # Catatan: gunakan libncurses-dev (BUKAN libncurses5-dev yang sudah deprecated)
    # ──────────────────────────────────────────────────────────────
    - name: Install build dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          clang \
          flex \
          bison \
          g++ \
          gawk \
          gcc-multilib \
          g++-multilib \
          gettext \
          git \
          libncurses-dev \
          libssl-dev \
          python3-distutils \
          python3-setuptools \
          rsync \
          swig \
          unzip \
          zlib1g-dev \
          file \
          wget \
          curl \
          libelf-dev

    # ──────────────────────────────────────────────────────────────
    # 4. UPDATE & INSTALL FEEDS
    # Feed diambil dari feeds.conf.default yang ada di repo.
    # Feed ini menentukan dari mana paket-paket diunduh.
    # ──────────────────────────────────────────────────────────────
    - name: Update and install feeds
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    # ──────────────────────────────────────────────────────────────
    # 5. TERAPKAN .config
    # Logika:
    # - Jika CONFIG_FILE berbeda dari .config → copy dulu (misal 'diffconfig')
    # - Jika CONFIG_FILE sudah bernama .config → tidak perlu copy (sudah ada)
    # - Selalu jalankan 'make defconfig' untuk mengisi nilai default
    #   bagi opsi yang belum ada di .config
    # ──────────────────────────────────────────────────────────────
    - name: Apply .config
      run: |
        if [ -f "$CONFIG_FILE" ]; then
          if [ "$CONFIG_FILE" != ".config" ]; then
            echo "Menyalin $CONFIG_FILE ke .config ..."
            cp "$CONFIG_FILE" .config
          else
            echo ".config sudah ada, tidak perlu copy."
          fi
        else
          echo "PERINGATAN: $CONFIG_FILE tidak ditemukan. Menggunakan defconfig."
        fi
        make defconfig

    # ──────────────────────────────────────────────────────────────
    # 6. DOWNLOAD PACKAGE SOURCES
    # Unduh semua source code paket ke folder dl/.
    # Dilakukan sebelum compile agar compile bisa offline.
    # ──────────────────────────────────────────────────────────────
    - name: Download package sources
      run: |
        make download -j$(nproc) 2>&1 | tee /tmp/download.log
        # Hapus file terlalu kecil yang kemungkinan download gagal
        find dl -size -1024c -delete 2>/dev/null || true
        # Periksa error kritis (bukan WARNING)
        if grep -E "^ERROR:" /tmp/download.log; then
          echo "Ada error saat download, cek log di atas!"
          exit 1
        fi

    # ──────────────────────────────────────────────────────────────
    # 7. COMPILE
    # Pertama coba dengan semua core (nproc).
    # Jika gagal, coba ulang dengan 1 core dan verbose untuk debug.
    # ──────────────────────────────────────────────────────────────
    - name: Compile firmware
      id: compile
      run: |
        echo "Mulai compile — $(date)"
        echo "Jumlah core: $(nproc)"
        make -j$(nproc) || {
          echo "Build multi-core gagal, mencoba ulang dengan -j1 V=s ..."
          make -j1 V=s
        }
        echo "Selesai compile — $(date)"
        echo "status=success" >> "$GITHUB_OUTPUT"

    # ──────────────────────────────────────────────────────────────
    # 8. KUMPULKAN OUTPUT FIRMWARE
    # ──────────────────────────────────────────────────────────────
    - name: Gather firmware files
      id: gather
      if: steps.compile.outputs.status == 'success'
      run: |
        TARGET_DIR=$(find bin/targets -mindepth 2 -maxdepth 2 -type d | head -1)
        echo "Direktori output: $TARGET_DIR"
        ls -lh "$TARGET_DIR"
        echo "firmware_path=$TARGET_DIR" >> "$GITHUB_OUTPUT"
        echo "status=success" >> "$GITHUB_OUTPUT"

    # ──────────────────────────────────────────────────────────────
    # 9. UPLOAD FIRMWARE SEBAGAI ARTIFACT
    # Firmware tersimpan 90 hari. Unduh dari tab Actions → Artifacts.
    # ──────────────────────────────────────────────────────────────
    - name: Upload firmware artifact
      uses: actions/upload-artifact@v4
      if: steps.gather.outputs.status == 'success'
      with:
        name: "OpenWrt-WP8722BT-run${{ github.run_number }}-${{ github.sha }}"
        path: |
          ${{ steps.gather.outputs.firmware_path }}
          !${{ steps.gather.outputs.firmware_path }}/packages
        retention-days: 90

    # Upload folder packages (opsional, hanya jika diminta via workflow_dispatch)
    - name: Upload packages artifact (opsional)
      uses: actions/upload-artifact@v4
      if: inputs.upload_packages == 'true' && steps.gather.outputs.status == 'success'
      with:
        name: "OpenWrt-WP8722BT-Packages-run${{ github.run_number }}"
        path: bin/packages/
        retention-days: 30

    # ──────────────────────────────────────────────────────────────
    # 10. UPLOAD LOG JIKA BUILD GAGAL
    # ──────────────────────────────────────────────────────────────
    - name: Upload build logs on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: "build-logs-run${{ github.run_number }}"
        path: |
          /tmp/download.log
          logs/
        retention-days: 7
