name: Build OpenWrt for Lite-On WP8722-BT

on:
  push:
    branches:
      - liteon_wp8722-bt

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Initialization Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /alloc /filesystem
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp nano p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils qemu-utils rsync scons squashfs-tools subversion swig texinfo u-boot-tools upx-ucl unzip vim wget xmlto xz-utils zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean

    - name: Update and Install Feeds
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load Custom Configuration
      run: |
        [ -f seed.config ] && cp -f seed.config .config
        make defconfig

    - name: Download Package Source Code
      run: |
        make download -j8
        find package -name "download" -o -name "git-src" | xargs rm -rf

    - name: Compile Firmware
      run: |
        echo "Building firmware..."
        make -j$(nproc) || make -j1 V=s
        echo "status=success" >> $GITHUB_ENV

    - name: Organize Compiled Files
      if: env.status == 'success'
      run: |
        cd bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV

    - name: Upload Firmware to GitHub Releases
      if: env.status == 'success'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: openwrt-wp8722-bt-${{ github.run_id }}
        name: OpenWrt Firmware for Lite-On WP8722-BT
        files: ${{ env.FIRMWARE_PATH }}/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
